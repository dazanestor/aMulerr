name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - combined-auth-categories
    paths:
      - "src/amulerr/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: src/amulerr/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/amulerr
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: src/amulerr
        run: pnpm typecheck

      - name: Lint
        working-directory: src/amulerr
        run: pnpm lint

      - name: Check formatting
        working-directory: src/amulerr
        run: pnpm check

      - name: Run tests
        working-directory: src/amulerr
        run: pnpm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amulerr
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=combined,enable=${{ github.ref_name == 'combined-auth-categories' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/amulerr
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
