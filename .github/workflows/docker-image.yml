name: Docker Image CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for creating GitHub releases
      packages: write # required for pushing to GHCR
    steps:
      - uses: actions/checkout@v3

      - name: Check if secrets are available
        id: secrets-check
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.secrets-check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.secrets-check.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set imgver tag
        id: imgver
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SAFE_BRANCH_NAME="$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            echo "IMG_VER=feat_${SAFE_BRANCH_NAME}" >> $GITHUB_ENV
          else
            echo "IMG_VER=$(date +'%Y-%m-%d')_${{ env.SHA }}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            isc30/amulerr
            ghcr.io/isc30/amulerr
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ env.IMG_VER }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/amulerr
          push: ${{ steps.secrets-check.outputs.available == 'true' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMG_VER=${{ env.IMG_VER }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.IMG_VER }}
          name: ${{ env.IMG_VER }}
          generate_release_notes: true
